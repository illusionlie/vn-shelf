<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List - VN Shelf</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/cards-detail.css">
  <link rel="stylesheet" href="css/tier.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body x-data="tierlistPage()">
  <!-- 公共壳层（进度条 / 背景遮罩 / Toast / 确认对话框，由 layout.js 注入） -->
  <div id="app-shell"></div>

  <!-- 头部导航 -->
  <header class="main-header">
    <div class="banner">
      <div class="banner-brand">
        <a href="/" class="banner-title">VN Shelf</a>
        <a
          href="https://github.com/illusionlie/vn-shelf"
          class="banner-github-link"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="nav.githubRepo"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.649.5.5 5.649.5 12a11.5 11.5 0 0 0 7.862 10.912c.575.106.785-.25.785-.554 0-.273-.01-.997-.016-1.956-3.199.695-3.874-1.542-3.874-1.542-.523-1.328-1.278-1.681-1.278-1.681-1.044-.714.08-.699.08-.699 1.155.081 1.763 1.186 1.763 1.186 1.026 1.76 2.692 1.252 3.348.957.104-.744.402-1.252.731-1.539-2.553-.29-5.236-1.277-5.236-5.684 0-1.255.448-2.281 1.183-3.085-.118-.29-.513-1.458.112-3.04 0 0 .965-.309 3.162 1.178a10.984 10.984 0 0 1 5.758 0c2.196-1.487 3.16-1.178 3.16-1.178.626 1.582.231 2.75.113 3.04.737.804 1.181 1.83 1.181 3.085 0 4.418-2.687 5.391-5.248 5.675.414.357.783 1.062.783 2.142 0 1.546-.014 2.793-.014 3.173 0 .307.207.665.79.552A11.503 11.503 0 0 0 23.5 12C23.5 5.649 18.351.5 12 .5z"></path>
          </svg>
        </a>
      </div>
      <div class="header-actions">
        <nav class="banner-nav desktop-only">
          <a href="/" data-i18n="nav.home"></a>
          <a href="/tier" class="active">Tier List</a>
          <a href="/stats" data-i18n="nav.stats"></a>
          <template x-if="$store.app.isAdmin"><a href="/settings" data-i18n="nav.settings"></a></template>
          <template x-if="!$store.app.isAdmin"><a href="/login" data-i18n="nav.login"></a></template>
        </nav>
        <button class="theme-toggle-btn" @click="toggleTheme()" aria-label="Toggle Theme">
          <svg class="light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div class="mobile-nav mobile-only">
          <button class="more-menu-toggle-btn" @click="toggleMobileMenu()" aria-label="Menu" aria-expanded="false" aria-controls="more-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div id="more-menu" class="more-menu" role="menu">
            <a href="/" role="menuitem" data-i18n="nav.home"></a>
            <a href="/tier" class="active" role="menuitem">Tier List</a>
            <a href="/stats" role="menuitem" data-i18n="nav.stats"></a>
            <template x-if="$store.app.isAdmin"><a href="/settings" role="menuitem" data-i18n="nav.settings"></a></template>
            <template x-if="!$store.app.isAdmin"><a href="/login" role="menuitem" data-i18n="nav.login"></a></template>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="container tier-container">
    <!-- 加载状态 -->
    <template x-if="isLoading">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </template>

    <template x-if="!isLoading">
      <div class="tier-board">
        <template x-if="tiers.length === 0">
          <div class="empty-state">
            <div class="empty-state-icon">🏷️</div>
            <div class="empty-state-title" data-i18n="tier.emptyTitle"></div>
            <p class="text-muted" data-i18n="tier.emptyHint"></p>
          </div>
        </template>

        <template x-for="tier in tiers" :key="tier.id">
          <section class="tier-row">
            <div class="tier-label" :style="`background:${tier.color}`">
              <span x-text="tier.name"></span>
            </div>
            <div
              class="tier-items"
              role="list"
              :aria-label="tier.name"
              :class="{ 'drag-over': dragOverTierId === tier.id }"
              @dragover="onDragOver(tier.id, $event)"
              @dragleave="onDragLeave(tier.id, $event)"
              @drop="onDrop(tier.id, $event)"
            >
              <template x-for="(vn, index) in getTierItems(tier.id)" :key="vn.id">
                <div class="tier-vn-slot" role="listitem">
                  <div class="tier-drop-indicator" x-show="isDropBefore(tier.id, index)"></div>
                  <button
                    type="button"
                    class="tier-vn-card"
                    :class="{ dragging: draggedVN?.id === vn.id }"
                    :draggable="$store.app.isAdmin"
                    :tabindex="$store.app.isAdmin ? 0 : -1"
                    :aria-grabbed="keyboardDragging && draggedVN?.id === vn.id ? 'true' : 'false'"
                    :aria-label="(vn.titleCn || vn.titleJa || vn.title) + ' · ' + tier.name"
                    @dragstart="onDragStart(vn, $event)"
                    @dragend="onDragEnd()"
                    @click="openDetail(vn)"
                    @keydown="onCardKeydown(vn, $event)"
                    :data-vn-id="vn.id"
                    x-data="{ showNsfw: false }"
                  >
                    <img
                      :src="vn.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
                      :alt="vn.titleCn || vn.titleJa || vn.title"
                      :class="{ 'nsfw-blur': vn.imageNsfw && !showNsfw }"
                      @error="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
                    >
                    <div class="nsfw-overlay" x-show="vn.imageNsfw && !showNsfw" @click.stop="showNsfw = true" data-i18n-title="common.clickToShow">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                    </div>
                  </button>
                </div>
              </template>

              <div class="tier-drop-indicator tier-drop-indicator-end" x-show="isDropAtEnd(tier.id)"></div>

              <template x-if="getTierItems(tier.id).length === 0">
                <div class="tier-empty" data-i18n="tier.dropHere"></div>
              </template>
            </div>

            <template x-if="$store.app.isAdmin">
              <div class="tier-row-actions">
                <button class="btn btn-secondary btn-sm" @click="moveTier(tier.id, -1)">↑</button>
                <button class="btn btn-secondary btn-sm" @click="moveTier(tier.id, 1)">↓</button>
                <button class="btn btn-secondary btn-sm" @click="openTierEdit(tier)" data-i18n="common.edit"></button>
                <button class="btn btn-danger btn-sm" @click="deleteTier(tier.id)" data-i18n="common.delete"></button>
              </div>
            </template>
          </section>
        </template>

        <template x-if="$store.app.isAdmin">
          <button class="tier-add-placeholder" @click="openCreateTier()" data-i18n-title="tier.newTier">
            <span class="tier-add-placeholder-icon">+</span>
            <span class="tier-add-placeholder-text" data-i18n="tier.newTier"></span>
          </button>
        </template>

        <template x-if="$store.app.isAdmin">
          <section class="untiered-section">
            <h2 class="settings-section-title" data-i18n="tier.untiered"></h2>
            <div
              class="untiered-grid"
              role="list"
              data-i18n-aria-label="tier.untiered"
              :class="{ 'drag-over': dragOverTierId === '__untiered__' }"
              @dragover="onDragOver('__untiered__', $event)"
              @dragleave="onDragLeave('__untiered__', $event)"
              @drop="onDropToUntiered($event)"
            >
              <template x-for="(vn, index) in untieredVN" :key="vn.id">
                <div class="tier-vn-slot" role="listitem">
                  <div class="tier-drop-indicator" x-show="isDropBefore(null, index)"></div>
                  <button
                    type="button"
                    class="tier-vn-card"
                    :class="{ dragging: draggedVN?.id === vn.id }"
                    draggable="true"
                    :tabindex="$store.app.isAdmin ? 0 : -1"
                    :aria-grabbed="keyboardDragging && draggedVN?.id === vn.id ? 'true' : 'false'"
                    :aria-label="(vn.titleCn || vn.titleJa || vn.title) + ' · ' + $t('tier.untiered')"
                    @dragstart="onDragStart(vn, $event)"
                    @dragend="onDragEnd()"
                    @click="openDetail(vn)"
                    @keydown="onCardKeydown(vn, $event)"
                    :data-vn-id="vn.id"
                    x-data="{ showNsfw: false }"
                  >
                    <img
                      :src="vn.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
                      :alt="vn.titleCn || vn.titleJa || vn.title"
                      :class="{ 'nsfw-blur': vn.imageNsfw && !showNsfw }"
                      @error="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
                    >
                    <div class="nsfw-overlay" x-show="vn.imageNsfw && !showNsfw" @click.stop="showNsfw = true" data-i18n-title="common.clickToShow">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                    </div>
                  </button>
                </div>
              </template>

              <div class="tier-drop-indicator tier-drop-indicator-end" x-show="isDropAtEnd(null)"></div>

              <template x-if="untieredVN.length === 0">
                <div class="tier-empty" data-i18n="tier.untieredEmpty"></div>
              </template>
            </div>
          </section>
        </template>
      </div>
    </template>
  </main>

  <!-- 详情模态框（复用首页结构） -->
  <div class="modal-overlay" :class="{ active: showDetail }" @click.self="closeDetail()" @keydown.escape.window="!$store.app._confirmDialog?.visible && closeDetail()">
    <div class="modal" x-ref="detailModal" x-show="showDetail" x-transition role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <template x-if="selectedVN">
        <div>
          <div class="modal-header">
            <h2 id="detailModalTitle" class="modal-title" x-text="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn || selectedVN.vndb?.titleJa || selectedVN.vndb?.title || $t('common.details')"></h2>
            <button class="modal-close" data-i18n-aria-label="common.close" @click="closeDetail()">&times;</button>
          </div>

          <div class="modal-body">
            <div class="detail-header">
              <div style="position:relative;flex-shrink:0;" x-data="{ showNsfw: false }">
                <img
                  :src="selectedVN.vndb?.image || ''"
                  :alt="selectedVN.vndb?.title"
                  class="detail-image"
                  :class="{ 'nsfw-blur': selectedVN.vndb?.imageNsfw && !showNsfw }"
                  @error="$event.target.style.display='none'"
                >
                <div
                  class="nsfw-overlay"
                  x-show="selectedVN.vndb?.imageNsfw && !showNsfw"
                  @click.stop="showNsfw = true"
                  style="border-radius:var(--border-radius-md);"
                  data-i18n-title="common.clickToShow"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                </div>
              </div>
              <div class="detail-info">
                <h1 class="detail-title">
                  <span x-text="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn || selectedVN.vndb?.titleJa || selectedVN.vndb?.title"></span>
                  <span class="all-age-badge" x-show="selectedVN.vndb?.allAge" data-i18n-title="common.allAgeTitle" data-i18n="common.allAge"></span>
                </h1>
                <p class="detail-subtitle" x-text="(selectedVN.user?.titleCn || selectedVN.vndb?.titleCn) ? (selectedVN.vndb?.titleJa || selectedVN.vndb?.title) : ''" x-show="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn"></p>
                <p class="detail-company" x-text="selectedVN.vndb?.developers?.join(', ') || ''" x-show="selectedVN.vndb?.developers?.length"></p>

                <div class="detail-stars-group" x-show="selectedVN.vndb?.rating">
                  <span class="detail-stars-label" data-i18n="common.vndbRating"></span>
                  <div class="detail-stars vndb-rating">
                    <div class="stars-container">
                      <template x-for="i in 10" :key="i">
                        <span class="star" :class="{ empty: i > Math.round(selectedVN.vndb?.rating || 0) }">★</span>
                      </template>
                    </div>
                    <span class="detail-rating-score" x-text="selectedVN.vndb?.rating?.toFixed(1) || '-'"></span>
                  </div>
                </div>

                <div class="detail-stars-group" x-show="selectedVN.user?.personalRating">
                  <span class="detail-stars-label" data-i18n="common.personalRating"></span>
                  <div class="detail-stars personal-rating">
                    <div class="stars-container">
                      <template x-for="i in 10" :key="i">
                        <span class="star" :class="{ empty: i > Math.round(selectedVN.user?.personalRating || 0) }">★</span>
                      </template>
                    </div>
                    <span class="detail-rating-score" x-text="selectedVN.user?.personalRating?.toFixed(1) || '-' "></span>
                  </div>
                </div>

                <div class="detail-meta">
                  <div class="detail-meta-item">
                    <span class="detail-meta-label" data-i18n="common.gameLength"></span>
                    <span class="detail-meta-value" x-text="selectedVN.vndb?.length || $t('common.unknown')"></span>
                  </div>
                  <div class="detail-meta-item">
                    <span class="detail-meta-label" data-i18n="common.myPlayTime"></span>
                    <span class="detail-meta-value" x-text="formatUserPlayTime(selectedVN.user)"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="detail-tags" x-show="getDisplayTags(selectedVN).length">
              <h4 class="detail-tags-title" data-i18n="common.tags"></h4>
              <div class="detail-tags-list">
                <template x-for="tag in getDisplayTags(selectedVN).slice(0, 15)" :key="tag">
                  <span class="detail-tag" x-text="tag"></span>
                </template>
              </div>
            </div>

            <div class="detail-review" x-show="selectedVN.user?.review">
              <h3 class="detail-review-title" data-i18n="common.review"></h3>
              <div class="detail-review-content" x-html="renderMarkdown(selectedVN.user?.review || '')"></div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Tier 编辑模态框 -->
  <div class="modal-overlay" :class="{ active: showTierEdit }" @click.self="closeTierEdit()" @keydown.escape.window="!$store.app._confirmDialog?.visible && closeTierEdit()">
    <div class="modal tier-edit-modal" x-ref="tierEditModal" x-show="showTierEdit" x-transition role="dialog" aria-modal="true" aria-labelledby="tierEditModalTitle">
      <div class="modal-header">
        <h2 id="tierEditModalTitle" class="modal-title" x-text="editingTier ? $t('tier.editTier') : $t('tier.createTier')"></h2>
        <button class="modal-close" data-i18n-aria-label="common.close" @click="closeTierEdit()">&times;</button>
      </div>

      <div class="modal-body">
        <form @submit.prevent="saveTier()">
          <div class="form-group">
            <label class="form-label" data-i18n="tier.nameLabel"></label>
            <input
              type="text"
              class="form-input"
              x-model="tierForm.name"
              data-i18n-placeholder="tier.namePlaceholder"
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="tier.colorLabel"></label>
            <input
              type="color"
              class="tier-color-input"
              x-model="tierForm.color"
            >
            <input
              type="text"
              class="form-input mt-4"
              x-model="tierForm.color"
              placeholder="#ff4757"
              pattern="^#[0-9a-fA-F]{6}$"
              required
            >
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closeTierEdit()" data-i18n="common.cancel"></button>
            <button type="submit" class="btn btn-primary" :disabled="isSavingTier" x-text="isSavingTier ? $t('common.saving') : $t('common.save')"></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

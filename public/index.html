<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.indexTitle">VN Shelf</title>
  <meta name="description" content="" data-i18n-content="meta.indexDescription">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/cards-detail.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body x-data="vnShelf()">
  <!-- 公共壳层（进度条 / 背景遮罩 / Toast / 确认对话框，由 layout.js 注入） -->
  <div id="app-shell"></div>

  <!-- 头部 -->
  <header class="main-header">
    <div class="banner">
      <div class="banner-brand">
        <a href="/" class="banner-title">VN Shelf</a>
        <a
          href="https://github.com/illusionlie/vn-shelf"
          class="banner-github-link"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="nav.githubRepo"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.649.5.5 5.649.5 12a11.5 11.5 0 0 0 7.862 10.912c.575.106.785-.25.785-.554 0-.273-.01-.997-.016-1.956-3.199.695-3.874-1.542-3.874-1.542-.523-1.328-1.278-1.681-1.278-1.681-1.044-.714.08-.699.08-.699 1.155.081 1.763 1.186 1.763 1.186 1.026 1.76 2.692 1.252 3.348.957.104-.744.402-1.252.731-1.539-2.553-.29-5.236-1.277-5.236-5.684 0-1.255.448-2.281 1.183-3.085-.118-.29-.513-1.458.112-3.04 0 0 .965-.309 3.162 1.178a10.984 10.984 0 0 1 5.758 0c2.196-1.487 3.16-1.178 3.16-1.178.626 1.582.231 2.75.113 3.04.737.804 1.181 1.83 1.181 3.085 0 4.418-2.687 5.391-5.248 5.675.414.357.783 1.062.783 2.142 0 1.546-.014 2.793-.014 3.173 0 .307.207.665.79.552A11.503 11.503 0 0 0 23.5 12C23.5 5.649 18.351.5 12 .5z"></path>
          </svg>
        </a>
      </div>
      <div class="header-actions">
        <nav class="banner-nav desktop-only">
          <a href="/" class="active" data-i18n="nav.home"></a>
          <a href="/tier">Tier List</a>
          <a href="/stats" data-i18n="nav.stats"></a>
          <template x-if="$store.app.isAdmin"><a href="/settings" data-i18n="nav.settings"></a></template>
          <template x-if="!$store.app.isAdmin"><a href="/login" data-i18n="nav.login"></a></template>
        </nav>
        <button class="theme-toggle-btn" @click="toggleTheme()" aria-label="Toggle Theme">
          <svg class="light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div class="mobile-nav mobile-only">
          <button class="more-menu-toggle-btn" @click="toggleMobileMenu()" aria-label="Menu" aria-expanded="false" aria-controls="more-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div id="more-menu" class="more-menu" role="menu">
            <a href="/" role="menuitem" data-i18n="nav.home"></a>
            <a href="/tier" role="menuitem">Tier List</a>
            <a href="/stats" role="menuitem" data-i18n="nav.stats"></a>
            <template x-if="$store.app.isAdmin"><a href="/settings" role="menuitem" data-i18n="nav.settings"></a></template>
            <template x-if="!$store.app.isAdmin"><a href="/login" role="menuitem" data-i18n="nav.login"></a></template>
          </div>
        </div>
      </div>
    </div>
    <!-- 控制条 -->
    <div class="controls-bar">
      <div class="search-container">
        <input type="text" class="search-input" data-i18n-placeholder="index.searchPlaceholder" data-i18n-aria-label="index.searchAriaLabel" x-model="searchQuery" @input="debouncedSearch()">
      </div>
      <select class="sort-select" data-i18n-aria-label="index.sortAriaLabel" x-model="sortBy" @change="handleSortChange()">
        <option value="created_desc" data-i18n="index.sortCreatedDesc"></option>
        <option value="created_asc" data-i18n="index.sortCreatedAsc"></option>
        <option value="rating_desc" data-i18n="index.sortRatingDesc"></option>
        <option value="rating_asc" data-i18n="index.sortRatingAsc"></option>
        <option value="personal_desc" data-i18n="index.sortPersonalDesc"></option>
        <option value="personal_asc" data-i18n="index.sortPersonalAsc"></option>
      </select>
      <select class="sort-select" data-i18n-aria-label="index.filterStatusAriaLabel" x-model="statusFilter" @change="handleStatusFilterChange()">
        <option value="all" data-i18n="index.filterStatusAll"></option>
        <option value="playing" data-i18n="status.playing"></option>
        <option value="finished" data-i18n="status.finished"></option>
        <option value="stalled" data-i18n="status.stalled"></option>
        <option value="dropped" data-i18n="status.dropped"></option>
        <option value="none" data-i18n="status.none"></option>
      </select>
      <template x-if="$store.app.isAdmin">
        <button class="btn btn-primary" @click="openEdit()" data-i18n="index.addButton"></button>
      </template>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="container">
    <!-- 加载状态 -->
    <template x-if="isLoading">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </template>

    <!-- 空状态 -->
    <template x-if="!isLoading && filteredList.length === 0">
      <div class="empty-state">
        <div class="empty-state-icon">📚</div>
        <div class="empty-state-title" data-i18n="index.emptyTitle"></div>
        <p class="text-muted">
          <template x-if="$store.app.isAdmin">
            <span data-i18n="index.emptyHintAdmin"></span>
          </template>
          <template x-if="!$store.app.isAdmin">
            <span data-i18n="index.emptyHintGuest"></span>
          </template>
        </p>
      </div>
    </template>

    <!-- 卡片网格 -->
    <div class="cards-grid" x-show="!isLoading && filteredList.length > 0">
      <template x-for="vn in filteredList" :key="vn.id">
        <div class="vn-card" role="button" tabindex="0" :aria-label="vn.titleCn || vn.titleJa || vn.title" @click="openDetail(vn)" @keydown.enter.space.prevent="openDetail(vn)">
          <div class="vn-card-image-wrapper" x-data="{ showNsfw: false }">
            <img
              :src="vn.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
              :alt="vn.title"
              class="vn-card-image"
              :class="{ 'nsfw-blur': vn.imageNsfw && !showNsfw }"
              @error="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect fill=%22%23334155%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
            >
            <div class="nsfw-overlay" x-show="vn.imageNsfw && !showNsfw" @click.stop="showNsfw = true" data-i18n-title="common.clickToShow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </div>
            <span class="all-age-badge" x-show="vn.allAge" data-i18n-title="common.allAgeTitle" data-i18n="common.allAge"></span>
          </div>
          <div class="vn-card-content">
            <h3 class="vn-card-title">
              <span x-text="vn.titleCn || vn.titleJa || vn.title"></span>
            </h3>
            <p class="vn-card-subtitle" x-text="vn.titleCn ? (vn.titleJa || vn.title) : ''" x-show="vn.titleCn"></p>
            <p class="vn-card-company" x-text="vn.developers?.[0] || ''" x-show="vn.developers?.[0]"></p>
            <hr class="card-divider">
            <div class="vn-card-meta">
              <div class="vn-card-rating">
                <span class="star">★</span>
                <span class="rating-value" x-text="vn.rating?.toFixed(2) || 'N/A'"></span>
              </div>
              <span
                class="status-badge"
                :class="'status-' + vn.status"
                x-show="statusBadgeLabel(vn.status)"
                :title="statusBadgeLabel(vn.status)"
                :aria-label="statusBadgeLabel(vn.status)"
              >
                <span x-html="statusIcon(vn.status)"></span>
                <span class="status-badge-label" x-text="statusBadgeLabel(vn.status)"></span>
              </span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- 详情模态框 -->
  <div class="modal-overlay" :class="{ active: showDetail }" @click.self="closeDetail()" @keydown.escape.window="!$store.app._confirmDialog?.visible && closeDetail()">
    <div class="modal" x-ref="detailModal" x-show="showDetail" x-transition role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <template x-if="selectedVN">
        <div>
          <div class="modal-header">
            <h2 id="detailModalTitle" class="modal-title" x-text="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn || selectedVN.vndb?.titleJa || selectedVN.vndb?.title || $t('common.details')"></h2>
            <button class="modal-close" data-i18n-aria-label="common.close" @click="closeDetail()">&times;</button>
          </div>

          <div class="modal-body">
            <div class="detail-header">
              <div style="position:relative;flex-shrink:0;" x-data="{ showNsfw: false }">
                <img
                  :src="selectedVN.vndb?.image || ''"
                  :alt="selectedVN.vndb?.title"
                  class="detail-image"
                  :class="{ 'nsfw-blur': selectedVN.vndb?.imageNsfw && !showNsfw }"
                  @error="$event.target.style.display='none'"
                >
                <div
                  class="nsfw-overlay"
                  x-show="selectedVN.vndb?.imageNsfw && !showNsfw"
                  @click.stop="showNsfw = true"
                  style="border-radius:var(--border-radius-md);"
                  data-i18n-title="common.clickToShow"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                </div>
              </div>
              <div class="detail-info">
                <h1 class="detail-title">
                  <a
                    :href="'https://vndb.org/' + selectedVN.id"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="detail-title-link"
                    data-i18n-title="index.viewOnVndb"
                  >
                    <span x-text="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn || selectedVN.vndb?.titleJa || selectedVN.vndb?.title"></span>
                  </a>
                  <a
                    :href="'https://vndb.org/' + selectedVN.id"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="vndb-link-btn"
                    data-i18n-title="index.goToVndb"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                      <polyline points="15 3 21 3 21 9"></polyline>
                      <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                  </a>
                  <span class="all-age-badge" x-show="selectedVN.vndb?.allAge" data-i18n-title="common.allAgeTitle" data-i18n="common.allAge"></span>
                  <span
                    class="status-badge"
                    :class="'status-' + selectedVN.user?.status"
                    x-show="statusBadgeLabel(selectedVN.user?.status)"
                    :title="statusBadgeLabel(selectedVN.user?.status)"
                    :aria-label="statusBadgeLabel(selectedVN.user?.status)"
                  >
                    <span x-html="statusIcon(selectedVN.user?.status)"></span>
                    <span class="status-badge-label" x-text="statusBadgeLabel(selectedVN.user?.status)"></span>
                  </span>
                </h1>
                <p class="detail-subtitle" x-text="(selectedVN.user?.titleCn || selectedVN.vndb?.titleCn) ? (selectedVN.vndb?.titleJa || selectedVN.vndb?.title) : ''" x-show="selectedVN.user?.titleCn || selectedVN.vndb?.titleCn"></p>
                <p class="detail-company" x-text="selectedVN.vndb?.developers?.join(', ') || ''" x-show="selectedVN.vndb?.developers?.length"></p>

                <!-- VNDB评分 -->
                <div class="detail-stars-group" x-show="selectedVN.vndb?.rating">
                  <span class="detail-stars-label" data-i18n="common.vndbRating"></span>
                  <div class="detail-stars vndb-rating">
                    <span class="star">★</span>
                    <span class="detail-rating-score" x-text="selectedVN.vndb?.rating?.toFixed(1) || '-'"></span>
                  </div>
                </div>

                <!-- 个人评分 -->
                <div class="detail-stars-group" x-show="selectedVN.user?.personalRating">
                  <span class="detail-stars-label" data-i18n="common.personalRating"></span>
                  <div class="detail-stars personal-rating">
                    <span class="star">★</span>
                    <span class="detail-rating-score" x-text="selectedVN.user?.personalRating?.toFixed(1) || '-'"></span>
                  </div>
                </div>

                <div class="detail-meta">
                  <div class="detail-meta-item">
                    <span class="detail-meta-label" data-i18n="common.gameLength"></span>
                    <span class="detail-meta-value" x-text="selectedVN.vndb?.length || $t('common.unknown')"></span>
                  </div>
                  <div class="detail-meta-item">
                    <span class="detail-meta-label" data-i18n="common.myPlayTime"></span>
                    <span class="detail-meta-value" x-text="formatUserPlayTime(selectedVN.user)"></span>
                  </div>
                </div>
              </div>
            </div>
            <div class="detail-tags" x-show="getDisplayTags(selectedVN).length">
              <h4 class="detail-tags-title" data-i18n="common.tags"></h4>
              <div class="detail-tags-list">
                <template x-for="tag in getDisplayTags(selectedVN).slice(0, 15)" :key="tag">
                  <span class="detail-tag" x-text="tag"></span>
                </template>
              </div>
            </div>

            <div class="detail-review" x-show="selectedVN.user?.review">
              <h3 class="detail-review-title" data-i18n="common.review"></h3>
              <div class="detail-review-content" x-html="renderMarkdown(selectedVN.user?.review || '')"></div>
            </div>
          </div>

          <div class="modal-footer" x-show="$store.app.isAdmin">
            <button class="btn btn-secondary" @click="openEdit(selectedVN)" data-i18n="common.edit"></button>
            <button class="btn btn-danger" @click="deleteVN()" data-i18n="common.delete"></button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div class="modal-overlay" :class="{ active: showEdit }" @click.self="closeEdit()" @keydown.escape.window="!$store.app._confirmDialog?.visible && closeEdit()">
    <div class="modal" x-ref="editModal" x-show="showEdit" x-transition role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <h2 id="editModalTitle" class="modal-title" x-text="editForm.isNew ? $t('index.addEntry') : $t('index.editEntry')"></h2>
        <button class="modal-close" data-i18n-aria-label="common.close" @click="closeEdit()">&times;</button>
      </div>

      <div class="modal-body">
        <form @submit.prevent="saveEdit()">
          <template x-if="editForm.isNew">
            <div class="form-group">
              <label class="form-label">VNDB ID *</label>
              <input
                type="text"
                class="form-input"
                x-model="editForm.vndbId"
                data-i18n-placeholder="index.vndbIdPlaceholder"
                required
              >
              <p class="form-hint" data-i18n="index.vndbIdHint"></p>
            </div>
          </template>

          <div class="form-group">
            <label class="form-label" data-i18n="index.titleCnLabel"></label>
            <input
              type="text"
              class="form-input"
              x-model="editForm.titleCn"
              data-i18n-placeholder="index.titleCnPlaceholder"
            >
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="common.personalRating"></label>
            <input
              type="number"
              class="form-input"
              x-model="editForm.personalRating"
              min="0"
              max="10"
              step="0.1"
              data-i18n-placeholder="index.ratingPlaceholder"
            >
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="index.statusLabel"></label>
            <select class="form-input" x-model="editForm.status">
              <option value="" data-i18n="status.none"></option>
              <option value="playing" data-i18n="status.playing"></option>
              <option value="finished" data-i18n="status.finished"></option>
              <option value="stalled" data-i18n="status.stalled"></option>
              <option value="dropped" data-i18n="status.dropped"></option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="index.playTimeLabel"></label>
            <div style="display:flex; gap:10px;">
              <input
                type="number"
                class="form-input"
                x-model.number="editForm.playTimeHours"
                min="0"
                step="1"
                data-i18n-placeholder="index.hoursPlaceholder"
              >
              <input
                type="number"
                class="form-input"
                x-model.number="editForm.playTimePartMinutes"
                min="0"
                step="1"
                data-i18n-placeholder="index.minutesPlaceholder"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="index.reviewLabel"></label>
            <textarea
              class="form-input form-textarea"
              x-model="editForm.review"
              data-i18n-placeholder="index.reviewPlaceholder"
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="index.startDateLabel"></label>
            <input
              type="date"
              class="form-input"
              x-model="editForm.startDate"
            >
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="index.finishDateLabel"></label>
            <input
              type="date"
              class="form-input"
              x-model="editForm.finishDate"
            >
          </div>

          <div class="form-group" x-show="config.tagsMode === 'manual'">
            <label class="form-label" data-i18n="index.tagsManualLabel"></label>
            <input
              type="text"
              class="form-input"
              x-model="editForm.tags"
              data-i18n-placeholder="index.tagsManualPlaceholder"
            >
            <p class="form-hint" data-i18n="index.tagsManualHint"></p>
          </div>

          <div class="form-group" x-show="config.tagsMode === 'vndb' && !editForm.isNew">
            <label class="form-label" data-i18n="common.tags"></label>
            <div class="detail-tags-list static">
              <template x-for="tag in getDisplayTags(selectedVN || editForm).slice(0, 15)" :key="tag">
                <span class="detail-tag" x-text="tag"></span>
              </template>
            </div>
            <p class="form-hint" data-i18n="index.tagsVndbHint"></p>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" @click="closeEdit()" data-i18n="common.cancel"></button>
        <button class="btn btn-primary" @click="saveEdit()" data-i18n="common.save"></button>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.settingsTitle">VN Shelf</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/settings.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body x-data="settingsPage()">
  <!-- 公共壳层（进度条 / 背景遮罩 / Toast / 确认对话框，由 layout.js 注入） -->
  <div id="app-shell"></div>

  <!-- 头部 -->
  <header class="main-header">
    <div class="banner">
      <div class="banner-brand">
        <a href="/" class="banner-title">VN Shelf</a>
        <a
          href="https://github.com/illusionlie/vn-shelf"
          class="banner-github-link"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="nav.githubRepo"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.649.5.5 5.649.5 12a11.5 11.5 0 0 0 7.862 10.912c.575.106.785-.25.785-.554 0-.273-.01-.997-.016-1.956-3.199.695-3.874-1.542-3.874-1.542-.523-1.328-1.278-1.681-1.278-1.681-1.044-.714.08-.699.08-.699 1.155.081 1.763 1.186 1.763 1.186 1.026 1.76 2.692 1.252 3.348.957.104-.744.402-1.252.731-1.539-2.553-.29-5.236-1.277-5.236-5.684 0-1.255.448-2.281 1.183-3.085-.118-.29-.513-1.458.112-3.04 0 0 .965-.309 3.162 1.178a10.984 10.984 0 0 1 5.758 0c2.196-1.487 3.16-1.178 3.16-1.178.626 1.582.231 2.75.113 3.04.737.804 1.181 1.83 1.181 3.085 0 4.418-2.687 5.391-5.248 5.675.414.357.783 1.062.783 2.142 0 1.546-.014 2.793-.014 3.173 0 .307.207.665.79.552A11.503 11.503 0 0 0 23.5 12C23.5 5.649 18.351.5 12 .5z"></path>
          </svg>
        </a>
      </div>
      <div class="header-actions">
        <nav class="banner-nav desktop-only">
          <a href="/" data-i18n="nav.home"></a>
          <a href="/tier">Tier List</a>
          <a href="/stats" data-i18n="nav.stats"></a>
          <a href="/settings" class="active" data-i18n="nav.settings"></a>
        </nav>
        <button class="theme-toggle-btn" @click="toggleTheme()" aria-label="Toggle Theme">
          <svg class="light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div class="mobile-nav mobile-only">
          <button class="more-menu-toggle-btn" @click="toggleMobileMenu()" aria-label="Menu" aria-expanded="false" aria-controls="more-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div id="more-menu" class="more-menu" role="menu">
            <a href="/" role="menuitem" data-i18n="nav.home"></a>
            <a href="/tier" role="menuitem">Tier List</a>
            <a href="/stats" role="menuitem" data-i18n="nav.stats"></a>
            <a href="/settings" role="menuitem" data-i18n="nav.settings"></a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="container">
    <h1 class="page-title" data-i18n="settings.pageTitle"></h1>

    <!-- VNDB API设置 -->
    <section class="settings-section">
      <h2 class="settings-section-title">VNDB API</h2>

      <div class="form-group">
        <label class="form-label">API Token</label>
        <div style="display: flex; gap: 12px;">
          <input
            type="password"
            class="form-input"
            x-model="vndbApiToken"
            data-i18n-placeholder="settings.tokenPlaceholder"
          >
          <button class="btn btn-primary" @click="saveVndbToken()" :disabled="isLoading" data-i18n="common.save">
          </button>
        </div>
        <p class="form-hint">
          <span data-i18n="settings.tokenStatusLabel"></span> <span x-text="config.hasVndbApiToken ? $t('settings.configured') : $t('settings.notConfigured')"></span>
          <span data-i18n="settings.tokenGetPrefix"></span> <a href="https://vndb.org/u/tokens" target="_blank">VNDB</a> <span data-i18n="settings.tokenGetSuffix"></span>
        </p>
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="settings.ulistImportLabel"></label>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <button
            class="btn btn-primary"
            @click="startUListImport()"
            :disabled="isLoading || isIndexTaskActive(indexStatus?.status)"
            data-i18n="settings.ulistImportButton"
          >
          </button>
        </div>
        <p class="form-hint" data-i18n="settings.ulistImportHint"></p>
      </div>
    </section>

    <!-- 密码设置 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="common.adminPassword"></h2>

      <div class="form-group">
        <label class="form-label" data-i18n="settings.newPasswordLabel"></label>
        <input
          type="password"
          class="form-input"
          x-model="newPassword"
          data-i18n-placeholder="common.passwordMinPlaceholder"
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="settings.confirmPasswordLabel"></label>
        <input
          type="password"
          class="form-input"
          x-model="confirmPassword"
          data-i18n-placeholder="settings.confirmPasswordPlaceholder"
        >
      </div>

      <button class="btn btn-primary" @click="changePassword()" :disabled="isLoading" data-i18n="settings.changePassword">
      </button>
    </section>

    <!-- 索引管理 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.indexSectionTitle"></h2>

      <template x-if="indexStatus">
        <div class="mb-4">
          <p class="text-muted">
            <span data-i18n="settings.taskTypeLabel"></span> <strong x-text="formatTaskType(indexStatus.type)"></strong>
          </p>
          <p class="text-muted">
            <span data-i18n="settings.statusLabel"></span> <strong x-text="formatStatus(indexStatus.status)"></strong>
            <span x-show="isIndexTaskActive(indexStatus.status)">
              <span data-i18n="settings.progressLabel"></span> <span x-text="indexStatus.processed"></span>/<span x-text="indexStatus.total"></span>
            </span>
          </p>
          <p class="text-muted" x-show="indexStatus.skipped > 0">
            <span data-i18n="settings.skippedLabel"></span> <span x-text="indexStatus.skipped"></span>
          </p>
          <p class="text-muted" x-show="indexStatus.startedAt">
            <span data-i18n="settings.startedAtLabel"></span> <span x-text="formatDateTime(indexStatus.startedAt)"></span>
          </p>
          <p class="text-muted" x-show="indexStatus.completedAt">
            <span data-i18n="settings.completedAtLabel"></span> <span x-text="formatDateTime(indexStatus.completedAt)"></span>
          </p>
          <p class="text-muted" x-show="indexStatus.lastReconciledAt">
            <span data-i18n="settings.lastReconciledLabel"></span> <span x-text="formatDateTime(indexStatus.lastReconciledAt)"></span>
          </p>
          <p class="text-muted" x-show="indexStatus.error">
            <span data-i18n="settings.noteLabel"></span> <span x-text="indexStatus.error"></span>
          </p>
          <p class="text-muted" x-show="indexStatus.failed?.length > 0">
            <span data-i18n="settings.failedLabel"></span> <span x-text="indexStatus.failed.join(', ')"></span>
          </p>
        </div>
      </template>

      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button
          class="btn btn-primary"
          @click="startIndex()"
          :disabled="isLoading || isIndexTaskActive(indexStatus?.status)"
          data-i18n="settings.startIndexButton"
        >
        </button>
        <button class="btn btn-secondary" @click="loadIndexStatus()" data-i18n="settings.refreshStatus">
        </button>
      </div>

      <p class="form-hint mt-4" data-i18n="settings.indexHint">
      </p>
    </section>

    <!-- Tags 设置 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.tagsSectionTitle"></h2>

      <div class="form-group">
        <label class="form-label" data-i18n="settings.tagsSourceLabel"></label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="tagsMode" value="vndb" x-model="config.tagsMode" @change="saveTagsConfig()">
            <span data-i18n="settings.tagsModeVndb"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="tagsMode" value="manual" x-model="config.tagsMode" @change="saveTagsConfig()">
            <span data-i18n="settings.tagsModeManual"></span>
          </label>
        </div>
        <p class="form-hint" data-i18n="settings.tagsModeHint"></p>
      </div>

      <!-- VNDB Tags 翻译设置 -->
      <template x-if="config.tagsMode === 'vndb'">
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" x-model="config.translateTags" @change="saveTagsConfig()">
            <span data-i18n="settings.translateTagsLabel"></span>
          </label>
          <p class="form-hint" data-i18n="settings.translateTagsHint"></p>
        </div>
      </template>

      <!-- 翻译文件 URL -->
      <template x-if="config.tagsMode === 'vndb' && config.translateTags">
        <div class="form-group">
          <label class="form-label" data-i18n="settings.translationUrlLabel"></label>
          <div style="display: flex; gap: 12px;">
            <input
              type="url"
              class="form-input"
              x-model="config.translationUrl"
              data-i18n-placeholder="settings.translationUrlPlaceholder"
            >
            <button class="btn btn-secondary" @click="saveTagsConfig()" :disabled="isLoading" data-i18n="common.save">
            </button>
          </div>
          <p class="form-hint" data-i18n="settings.translationUrlHint"></p>

          <!-- 翻译缓存状态 -->
          <template x-if="translationCacheStatus">
            <div class="cache-status mt-4">
              <p class="text-muted">
                <span data-i18n="settings.cacheStatusLabel"></span>
                <strong x-text="translationCacheStatus.version || $t('common.unknown')"></strong>
                <span x-show="translationCacheStatus.updatedAt">
                  <span data-i18n="settings.updatedAtPrefix"></span> <span x-text="formatDate(translationCacheStatus.updatedAt)"></span>
                </span>
              </p>
              <p class="text-muted">
                <span data-i18n="settings.cachedCountPrefix"></span> <strong x-text="translationCacheStatus.count || 0"></strong> <span data-i18n="settings.cachedCountSuffix"></span>
              </p>
              <button class="btn btn-secondary btn-sm mt-2" @click="clearTranslationCache()" data-i18n="settings.clearCache">
              </button>
            </div>
          </template>
        </div>
      </template>
    </section>

    <!-- 外观设置 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.appearanceSectionTitle"></h2>

      <div class="form-group">
        <label class="form-label" data-i18n="settings.backgroundUrlLabel"></label>
        <div style="display: flex; gap: 12px;">
          <input
            type="url"
            class="form-input"
            x-model="config.backgroundUrl"
            data-i18n-placeholder="settings.backgroundUrlPlaceholder"
          >
          <button
            class="btn btn-secondary"
            @click="config.backgroundUrl = ''; previewBackground()"
            :disabled="!config.backgroundUrl"
            data-i18n="common.clear"
          >
          </button>
        </div>
        <p class="form-hint" data-i18n="settings.backgroundUrlHint"></p>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span data-i18n="settings.overlayOpacityLabel"></span> <span x-text="Math.round((config.backgroundOverlay ?? 0.5) * 100) + '%'"></span>
        </label>
        <input
          type="range"
          class="form-range"
          min="0"
          max="1"
          step="0.05"
          x-model.number="config.backgroundOverlay"
          @input="previewBackground()"
        >
        <p class="form-hint" data-i18n="settings.overlayOpacityHint"></p>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span data-i18n="settings.blurLabel"></span> <span x-text="(config.backgroundBlur ?? 4) + 'px'"></span>
        </label>
        <input
          type="range"
          class="form-range"
          min="0"
          max="20"
          step="1"
          x-model.number="config.backgroundBlur"
          @input="previewBackground()"
        >
        <p class="form-hint" data-i18n="settings.blurHint"></p>
      </div>

      <button class="btn btn-primary" @click="saveAppearanceConfig()" :disabled="isLoading" data-i18n="settings.saveAppearance">
      </button>
    </section>

    <!-- 语言设置 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.languageSectionTitle"></h2>

      <div class="form-group">
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="uiLocale" value="zh-CN" x-model="locale" @change="changeLocale()">
            <span>简体中文</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="uiLocale" value="en" x-model="locale" @change="changeLocale()">
            <span>English</span>
          </label>
        </div>
        <p class="form-hint" data-i18n="settings.languageHint"></p>
      </div>
    </section>

    <!-- 数据导入导出 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.dataSectionTitle"></h2>

      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="btn btn-secondary" @click="exportData()" data-i18n="settings.exportData">
        </button>

        <label class="btn btn-secondary" style="cursor: pointer;">
          <span data-i18n="settings.importData"></span>
          <input
            type="file"
            accept=".json"
            @change="importData($event)"
            style="display: none;"
          >
        </label>
      </div>

      <p class="form-hint mt-4" data-i18n="settings.dataHint">
      </p>
    </section>

    <!-- 退出登录 -->
    <section class="settings-section">
      <h2 class="settings-section-title" data-i18n="settings.accountSectionTitle"></h2>

      <button class="btn btn-danger" @click="logout()" data-i18n="settings.logout">
      </button>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // 首帧前应用主题 class（html.dark-mode），避免暗色用户白闪：
    // localStorage 显式选择优先，无存储值时跟随系统 prefers-color-scheme。
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) { /* localStorage 不可用时保持亮色默认 */ }
    })();
  </script>
  <title data-i18n="meta.statsTitle">VN Shelf</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/stats.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body x-data="statsPage()">
  <!-- 公共壳层（进度条 / 背景遮罩 / Toast / 确认对话框，由 layout.js 注入） -->
  <div id="app-shell"></div>

  <!-- 头部导航 -->
  <header class="main-header">
    <div class="banner">
      <div class="banner-brand">
        <a href="/" class="banner-title">VN Shelf</a>
        <a
          href="https://github.com/illusionlie/vn-shelf"
          class="banner-github-link"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n-aria-label="nav.githubRepo"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.649.5.5 5.649.5 12a11.5 11.5 0 0 0 7.862 10.912c.575.106.785-.25.785-.554 0-.273-.01-.997-.016-1.956-3.199.695-3.874-1.542-3.874-1.542-.523-1.328-1.278-1.681-1.278-1.681-1.044-.714.08-.699.08-.699 1.155.081 1.763 1.186 1.763 1.186 1.026 1.76 2.692 1.252 3.348.957.104-.744.402-1.252.731-1.539-2.553-.29-5.236-1.277-5.236-5.684 0-1.255.448-2.281 1.183-3.085-.118-.29-.513-1.458.112-3.04 0 0 .965-.309 3.162 1.178a10.984 10.984 0 0 1 5.758 0c2.196-1.487 3.16-1.178 3.16-1.178.626 1.582.231 2.75.113 3.04.737.804 1.181 1.83 1.181 3.085 0 4.418-2.687 5.391-5.248 5.675.414.357.783 1.062.783 2.142 0 1.546-.014 2.793-.014 3.173 0 .307.207.665.79.552A11.503 11.503 0 0 0 23.5 12C23.5 5.649 18.351.5 12 .5z"></path>
          </svg>
        </a>
      </div>
      <div class="header-actions">
        <nav class="banner-nav desktop-only">
          <a href="/" data-i18n="nav.home"></a>
          <a href="/tier">Tier List</a>
          <a href="/stats" class="active" data-i18n="nav.stats"></a>
          <template x-if="$store.app.isAdmin"><a href="/settings" data-i18n="nav.settings"></a></template>
          <template x-if="!$store.app.isAdmin"><a href="/login" data-i18n="nav.login"></a></template>
        </nav>
        <button class="theme-toggle-btn" @click="toggleTheme()" aria-label="Toggle Theme">
          <svg class="light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div class="mobile-nav mobile-only">
          <button class="more-menu-toggle-btn" @click="toggleMobileMenu()" aria-label="Menu" aria-expanded="false" aria-controls="more-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div id="more-menu" class="more-menu" role="menu">
            <a href="/" role="menuitem" data-i18n="nav.home"></a>
            <a href="/tier" role="menuitem">Tier List</a>
            <a href="/stats" class="active" role="menuitem" data-i18n="nav.stats"></a>
            <template x-if="$store.app.isAdmin"><a href="/settings" role="menuitem" data-i18n="nav.settings"></a></template>
            <template x-if="!$store.app.isAdmin"><a href="/login" role="menuitem" data-i18n="nav.login"></a></template>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="container">
    <h1 class="page-title" data-i18n="stats.pageTitle"></h1>

    <!-- 加载状态 -->
    <template x-if="isLoading">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </template>

    <!-- 统计内容 -->
    <template x-if="!isLoading && stats && stats.total > 0">
      <div>
        <!-- 概览摘要条：单容器横排全部指标（已完成与完成率合并为一项） -->
        <div class="stats-overview">
          <div class="stats-overview-item">
            <div class="stats-overview-value" x-text="stats.total || 0"></div>
            <div class="stats-overview-label" data-i18n="stats.totalEntries"></div>
          </div>

          <div class="stats-overview-item">
            <div class="stats-overview-value" x-text="formatMinutes(stats.totalPlayTimeMinutes)"></div>
            <div class="stats-overview-label" data-i18n="stats.totalPlayTime"></div>
          </div>

          <div class="stats-overview-item">
            <div class="stats-overview-value" x-text="formatRating(stats.avgRating)"></div>
            <div class="stats-overview-label" data-i18n="stats.avgVndbRating"></div>
          </div>

          <div class="stats-overview-item">
            <div class="stats-overview-value" x-text="formatRating(stats.avgPersonalRating)"></div>
            <div class="stats-overview-label" data-i18n="stats.avgPersonalRating"></div>
          </div>

          <div class="stats-overview-item">
            <div class="stats-overview-value">
              <span x-text="finishedCount"></span><span class="stats-overview-rate" x-text="`(${finishedRatePercent}%)`"></span>
            </div>
            <div class="stats-overview-label" data-i18n="stats.finishedEntries"></div>
          </div>
        </div>

        <!-- ① 游玩状态 -->
        <section class="settings-section">
          <h2 class="settings-section-title" data-i18n="stats.statusTitle"></h2>
          <div class="status-stack" role="img" :aria-label="statusAriaLabel">
            <template x-for="segment in statusSegments" :key="segment.key">
              <div class="status-stack-segment" :class="'status-seg-' + segment.key" :style="`width: ${segment.percent}%`"></div>
            </template>
          </div>
          <div class="status-legend">
            <template x-for="segment in statusSegments" :key="segment.key">
              <span class="status-legend-item">
                <span class="status-legend-dot" :class="'status-seg-' + segment.key" aria-hidden="true"></span>
                <span x-text="statusLabel(segment.key)"></span>
                <span class="status-legend-count" x-text="`${segment.count} (${segment.percent.toFixed(0)}%)`"></span>
              </span>
            </template>
          </div>
        </section>

        <!-- ② 评分分析 -->
        <section class="settings-section">
          <h2 class="settings-section-title" data-i18n="stats.ratingTitle"></h2>

          <template x-if="hasRatingSamples">
            <div class="histogram-row">
              <div class="histogram-block" role="img" :aria-label="histogramAriaLabel('personal')">
                <h3 class="stats-subtitle stats-subtitle-personal" data-i18n="stats.personalHistogram"></h3>
                <div class="histogram-bars" aria-hidden="true">
                  <template x-for="bar in histogramBars('personal')" :key="bar.score">
                    <div class="histogram-col">
                      <span class="histogram-count" x-text="bar.count || ''"></span>
                      <div class="histogram-bar-track">
                        <div class="histogram-bar histogram-bar-personal" :class="{ 'is-zero': !bar.count }" :style="`height: ${bar.heightPercent}%`"></div>
                      </div>
                      <span class="histogram-score" x-text="bar.score"></span>
                    </div>
                  </template>
                </div>
              </div>

              <div class="histogram-block" role="img" :aria-label="histogramAriaLabel('vndb')">
                <h3 class="stats-subtitle stats-subtitle-vndb" data-i18n="stats.vndbHistogram"></h3>
                <div class="histogram-bars" aria-hidden="true">
                  <template x-for="bar in histogramBars('vndb')" :key="bar.score">
                    <div class="histogram-col">
                      <span class="histogram-count" x-text="bar.count || ''"></span>
                      <div class="histogram-bar-track">
                        <div class="histogram-bar histogram-bar-vndb" :class="{ 'is-zero': !bar.count }" :style="`height: ${bar.heightPercent}%`"></div>
                      </div>
                      <span class="histogram-score" x-text="bar.score"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
          <template x-if="!hasRatingSamples">
            <p class="text-muted" data-i18n="stats.noRatingSamples"></p>
          </template>

          <template x-if="stats.ratingDiff.count > 0">
            <div class="diff-block">
              <p class="diff-summary" x-text="diffSummaryText"></p>
              <div class="diff-lists">
                <div class="diff-list">
                  <h3 class="stats-subtitle" data-i18n="stats.overratedTitle"></h3>
                  <template x-if="stats.ratingDiff.overrated.length > 0">
                    <ol class="diff-items">
                      <template x-for="item in stats.ratingDiff.overrated" :key="item.id">
                        <li class="diff-item">
                          <a class="diff-item-title" :href="vndbUrl(item.id)" target="_blank" rel="noopener noreferrer" x-text="displayTitle(item)"></a>
                          <span class="diff-item-scores">
                            <span class="diff-score diff-score-personal" x-text="item.personal.toFixed(1)"></span>
                            <span class="diff-vs" aria-hidden="true">/</span>
                            <span class="diff-score diff-score-vndb" x-text="item.vndb.toFixed(1)"></span>
                            <span class="diff-badge diff-badge-positive" x-text="formatDiff(item.diff)"></span>
                          </span>
                        </li>
                      </template>
                    </ol>
                  </template>
                  <template x-if="stats.ratingDiff.overrated.length === 0">
                    <p class="text-muted" data-i18n="stats.noDiffItems"></p>
                  </template>
                </div>

                <div class="diff-list">
                  <h3 class="stats-subtitle" data-i18n="stats.underratedTitle"></h3>
                  <template x-if="stats.ratingDiff.underrated.length > 0">
                    <ol class="diff-items">
                      <template x-for="item in stats.ratingDiff.underrated" :key="item.id">
                        <li class="diff-item">
                          <a class="diff-item-title" :href="vndbUrl(item.id)" target="_blank" rel="noopener noreferrer" x-text="displayTitle(item)"></a>
                          <span class="diff-item-scores">
                            <span class="diff-score diff-score-personal" x-text="item.personal.toFixed(1)"></span>
                            <span class="diff-vs" aria-hidden="true">/</span>
                            <span class="diff-score diff-score-vndb" x-text="item.vndb.toFixed(1)"></span>
                            <span class="diff-badge diff-badge-negative" x-text="formatDiff(item.diff)"></span>
                          </span>
                        </li>
                      </template>
                    </ol>
                  </template>
                  <template x-if="stats.ratingDiff.underrated.length === 0">
                    <p class="text-muted" data-i18n="stats.noDiffItems"></p>
                  </template>
                </div>
              </div>
            </div>
          </template>
          <template x-if="stats.ratingDiff.count === 0">
            <p class="text-muted" data-i18n="stats.noDiffSamples"></p>
          </template>
        </section>

        <!-- ③ 完成时间线 -->
        <section class="settings-section">
          <h2 class="settings-section-title" data-i18n="stats.timelineTitle"></h2>
          <template x-if="timelineYears.length > 0">
            <div>
              <div class="timeline-header">
                <div class="year-tabs" role="tablist" :aria-label="$t('stats.timelineTitle')">
                  <template x-for="year in timelineYears" :key="year">
                    <button
                      type="button"
                      class="year-tab"
                      :class="{ 'active': selectedYear === year }"
                      role="tab"
                      :aria-selected="selectedYear === year ? 'true' : 'false'"
                      @click="selectedYear = year"
                      x-text="year"
                    ></button>
                  </template>
                </div>
                <span class="timeline-year-total text-muted" x-text="yearTotalText"></span>
              </div>
              <div class="month-bars" role="img" :aria-label="timelineAriaLabel">
                <template x-for="item in yearMonths" :key="item.monthIndex">
                  <div class="month-col" :title="monthTooltip(item)">
                    <span class="month-count" x-text="item.finished || ''"></span>
                    <div class="month-bar-track" aria-hidden="true">
                      <div class="month-bar" :class="{ 'month-bar-empty': !item.finished }" :style="`height: ${item.heightPercent}%`"></div>
                    </div>
                    <span class="month-label" x-text="item.monthIndex"></span>
                  </div>
                </template>
              </div>
              <p class="text-muted timeline-span" x-text="spanText"></p>
            </div>
          </template>
          <template x-if="timelineYears.length === 0">
            <p class="text-muted" data-i18n="stats.noTimelineSamples"></p>
          </template>
        </section>

        <!-- ④ 偏好画像 -->
        <div class="pref-row">
          <section class="settings-section pref-section">
            <h2 class="settings-section-title" data-i18n="stats.developersTitle"></h2>
            <template x-if="developerBars.length > 0">
              <ol class="dev-items">
                <template x-for="dev in developerBars" :key="dev.name">
                  <li class="dev-item">
                    <div class="dev-item-head">
                      <span class="dev-name" x-text="dev.name"></span>
                      <span class="dev-meta">
                        <span x-text="devCountText(dev)"></span>
                        <template x-if="dev.avgPersonalRating !== null">
                          <span class="dev-avg" :title="$t('stats.devAvgTitle')" x-text="dev.avgPersonalRating.toFixed(1)"></span>
                        </template>
                      </span>
                    </div>
                    <div class="dev-bar-track" aria-hidden="true">
                      <div class="dev-bar" :style="`width: ${dev.widthPercent}%`"></div>
                    </div>
                  </li>
                </template>
              </ol>
            </template>
            <template x-if="developerBars.length === 0">
              <p class="text-muted" data-i18n="stats.noDeveloperSamples"></p>
            </template>
          </section>

          <section class="settings-section pref-section">
            <h2 class="settings-section-title" data-i18n="stats.tagsTitle"></h2>
            <template x-if="displayTopTags.length > 0">
              <div class="stats-tag-cloud">
                <template x-for="tag in displayTopTags" :key="tag.key">
                  <span class="stats-tag">
                    <span x-text="tag.name"></span>
                    <span class="stats-tag-count" x-text="tag.count"></span>
                  </span>
                </template>
              </div>
            </template>
            <template x-if="displayTopTags.length === 0">
              <p class="text-muted" data-i18n="stats.noTagSamples"></p>
            </template>
          </section>
        </div>

        <!-- 关于统计 -->
        <div class="settings-section">
          <h2 class="settings-section-title" data-i18n="stats.aboutTitle"></h2>
          <p class="text-muted" data-i18n="stats.aboutText"></p>
        </div>
      </div>
    </template>

    <!-- 空状态 -->
    <template x-if="!isLoading && (!stats || !stats.total)">
      <div class="empty-state">
        <div class="empty-state-icon">📊</div>
        <div class="empty-state-title" data-i18n="stats.emptyTitle"></div>
        <p class="text-muted" data-i18n="stats.emptyHint"></p>
      </div>
    </template>
  </main>
</body>
</html>

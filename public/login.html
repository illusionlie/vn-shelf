<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // 首帧前应用主题 class（html.dark-mode），避免暗色用户白闪：
    // localStorage 显式选择优先，无存储值时跟随系统 prefers-color-scheme。
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) { /* localStorage 不可用时保持亮色默认 */ }
    })();
  </script>
  <title data-i18n="meta.loginTitle">VN Shelf</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/login.css">
  <script type="module" src="js/app.js"></script>
  <script defer src="/js/vendor/alpine.min.js"></script>
</head>
<body x-data="loginPage()" class="login-page">
  <!-- 公共壳层（进度条 / 背景遮罩 / Toast / 确认对话框，由 layout.js 注入） -->
  <div id="app-shell"></div>
  
  <div class="login-container">
    <div class="login-box">
      <h1 class="login-title">VN Shelf</h1>
      
      <!-- 初始化表单 -->
      <template x-if="isInitialized === false">
        <form @submit.prevent="handleSubmit()">
          <div class="form-group">
            <label class="form-label" data-i18n="login.setPasswordLabel"></label>
            <input
              type="password"
              class="form-input"
              x-model="password"
              data-i18n-placeholder="common.passwordMinPlaceholder"
              required
              minlength="6"
            >
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="login.vndbTokenLabel"></label>
            <input
              type="text"
              class="form-input"
              x-model="vndbApiToken"
              data-i18n-placeholder="login.vndbTokenPlaceholder"
            >
            <p class="form-hint">
              <span data-i18n="login.tokenHintPrefix"></span> <a href="https://vndb.org/u/tokens" target="_blank">VNDB</a> <span data-i18n="login.tokenHintSuffix"></span>
            </p>
          </div>

          <p class="form-error" x-text="error" x-show="error"></p>

          <button type="submit" class="btn btn-primary" style="width: 100%" :disabled="isLoading">
            <span x-show="isLoading" data-i18n="login.initializing"></span>
            <span x-show="!isLoading" data-i18n="login.initAndLogin"></span>
          </button>
        </form>
      </template>

      <!-- 登录表单 -->
      <template x-if="isInitialized === true">
        <form @submit.prevent="handleSubmit()">
          <div class="form-group">
            <label class="form-label" data-i18n="common.adminPassword"></label>
            <input
              type="password"
              class="form-input"
              x-model="password"
              data-i18n-placeholder="validation.passwordRequired"
              required
              autofocus
            >
          </div>

          <p class="form-error" x-text="error" x-show="error"></p>

          <button type="submit" class="btn btn-primary" style="width: 100%" :disabled="isLoading">
            <span x-show="isLoading" data-i18n="login.loggingIn"></span>
            <span x-show="!isLoading" data-i18n="login.submit"></span>
          </button>

          <p class="text-center text-muted mt-4">
            <a href="/" data-i18n="login.backToHome"></a>
          </p>
        </form>
      </template>
      
      <!-- 加载状态 -->
      <template x-if="isInitialized === null">
        <div class="loading">
          <div class="loading-spinner"></div>
        </div>
      </template>
    </div>
  </div>
</body>
</html>

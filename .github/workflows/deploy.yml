name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    name: Build and Deploy to Cloudflare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          echo "Validating secrets..."
          if [ -z "${{ secrets.WORKER_NAME }}" ]; then
            echo "::error::Secret WORKER_NAME is not set. Please add it to your repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::error::Secret CF_API_TOKEN is not set. Please add it to your repository secrets."
            exit 1
          fi
          if [ -n "${{ secrets.CF_D1_DATABASE_ID }}" ]; then
            echo "CF_D1_DATABASE_ID is set: will bind the provided D1 database (verified before deploy)."
          else
            echo "CF_D1_DATABASE_ID is not set: will resolve D1 database 'vn-shelf-db' by name and create it if missing."
          fi
          echo "✅ All necessary secrets are set."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Automatically get an account id via the API Token
      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          if [[ -n "${{ secrets.CF_ACCOUNT_ID }}" ]]; then
            ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
            echo "Using provided CF_ACCOUNT_ID from secrets."
          else
            ACCOUNT_ID=$(curl -X GET "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type:application/json" | jq ".result[0].id" -r)
            if [[ "$ACCOUNT_ID" == "null" ]]; then
              echo "Failed to get an account id, please make sure you have set up CF_API_TOKEN correctly!"
              exit 1
            fi
          fi
          echo 'account_id='$ACCOUNT_ID >> $GITHUB_OUTPUT

        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # Preflight: make sure the D1 database and the Queue exist (create when missing).
      # `wrangler deploy` does NOT auto-create Queues, and the D1 id is resolved here by name
      # so CF_D1_DATABASE_ID is only an optional override for binding an existing database.
      - name: Ensure Cloudflare resources (D1 + Queue)
        id: ensure_resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          # wrangler prints its version banner to stdout; keep `d1 list --json` output pure JSON for jq.
          WRANGLER_HIDE_BANNER: "true"
          # wrangler.toml (send_metrics = false) is not generated yet at this point.
          WRANGLER_SEND_METRICS: "false"
          D1_NAME: vn-shelf-db          # must match database_name in wrangler.toml.example
          QUEUE_NAME: vn-index-queue    # must match queue in wrangler.toml.example
          PROVIDED_D1_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          d1_list() { npx wrangler d1 list --json; }
          d1_id_by_name() { d1_list | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid' | head -n1; }

          # ---- D1 ----
          if [[ -n "$PROVIDED_D1_ID" ]]; then
            if d1_list | jq -e --arg id "$PROVIDED_D1_ID" '.[] | select(.uuid == $id)' >/dev/null; then
              echo "Using provided CF_D1_DATABASE_ID (verified to exist in account)."
              D1_ID="$PROVIDED_D1_ID"
              D1_LABEL="provided CF_D1_DATABASE_ID"
            else
              echo "::error::CF_D1_DATABASE_ID is set but no D1 database with that id exists in this account. Fix or remove the secret."
              exit 1
            fi
          else
            D1_ID="$(d1_id_by_name)"
            D1_LABEL="'$D1_NAME'"
            if [[ -n "$D1_ID" ]]; then
              echo "D1 database '$D1_NAME' already exists, reusing."
            else
              echo "::warning::D1 database '$D1_NAME' not found — creating a NEW EMPTY database. If you expected existing data, stop and check the Cloudflare dashboard."
              npx wrangler d1 create "$D1_NAME"
              D1_ID="$(d1_id_by_name)"
              if [[ -z "$D1_ID" ]]; then
                echo "::error::D1 database '$D1_NAME' was created but its id could not be resolved."
                exit 1
              fi
            fi
          fi
          echo "::add-mask::$D1_ID"
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved D1 $D1_LABEL -> ****${D1_ID: -4}"

          # ---- Queue ----
          if npx wrangler queues info "$QUEUE_NAME" >/dev/null 2>/tmp/queue-info.err; then
            echo "Queue '$QUEUE_NAME' already exists, reusing."
          else
            echo "Queue '$QUEUE_NAME' lookup failed (output below), attempting to create it..."
            cat /tmp/queue-info.err || true
            npx wrangler queues create "$QUEUE_NAME"
          fi

      - name: Generate wrangler.toml from template
        run: |
          sed -e "s/__WORKER_NAME__/${{ secrets.WORKER_NAME }}/g" \
            -e "s/__D1_DATABASE_ID__/${{ steps.ensure_resources.outputs.d1_id }}/g" \
            wrangler.toml.example > wrangler.toml
          if [[ -n "${{ secrets.CUSTOM_DOMAIN }}" ]]; then
            echo "Setting custom domain to ${{ secrets.CUSTOM_DOMAIN }}"
            echo -e "\n[[routes]]\n \
              pattern = \"${{ secrets.CUSTOM_DOMAIN }}\"\n \
              custom_domain = true" \
              >> wrangler.toml
          fi

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
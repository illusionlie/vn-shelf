name: "✨ 功能请求 / Feature Request"
description: "提出新功能或改进建议 / Suggest a new feature or improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！清晰的动机描述能帮助我们判断优先级。
        Thanks for the suggestion! A clear motivation helps us prioritize.

  - type: checkboxes
    id: preflight
    attributes:
      label: "前置检查 / Preflight checklist"
      options:
        - label: "我已搜索过现有 issue，确认这不是重复请求 / I have searched existing issues and this is not a duplicate"
          required: true

  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem to solve"
      description: "这个功能想解决什么痛点？是否与现有困扰有关？/ What problem does this solve? Is it related to a current frustration?"
      placeholder: "当我...时，我总是很困扰，因为... / I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "期望的方案 / Proposed solution"
      description: "你希望它如何工作 / Describe how you'd like it to work"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案 / Alternatives considered"
      description: "你考虑过的其他做法 / Any alternative solutions or features you've considered"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: "相关范围 / Related area"
      options:
        - "前端界面 / Frontend UI"
        - "VNDB 集成 / VNDB integration"
        - "Tier List"
        - "认证 / Auth"
        - "批量索引 / Indexing (Queue)"
        - "导入导出 / Import & Export"
        - "统计 / Stats"
        - "其他 / Other"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "补充信息 / Additional context"
      description: "截图、参考链接或其他背景 / Screenshots, references, or any other context"
    validations:
      required: false
